
name: Terraform Security Scan

on:
  pull_request:
    branches:
      - main
      - dev
      - 'FEATURE_*'
      - 'FIX_*'

permissions:
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: module

jobs:
  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        id: checkout

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        id: checkov
        continue-on-error: true
        run: |
          checkov \
            -d "$TF_WORKING_DIR" \
            --framework terraform \
            --quiet > checkov-report.txt 2>&1

      - name: Publish PR Comment
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CHECKOV_OUTCOME: ${{ steps.checkov.outcome }}
        with:
          script: |
            const fs = require('fs');

            const report = fs.existsSync('checkov-report.txt')
              ? fs.readFileSync('checkov-report.txt', 'utf8')
              : 'Checkov report was not generated.';

            const success = process.env.CHECKOV_OUTCOME === 'success';

            const marker = '<!-- terraform-security-scan -->';

            const status = success
              ? '## Terraform Security Scan: PASSED'
              : '## Terraform Security Scan: FAILED';

            const body = [
              marker,
              status,
              '',
              `**Module:** \`${process.env.TF_WORKING_DIR}\``,
              `**Workflow:** ${context.workflow}`,
              `**Commit:** \`${context.sha.substring(0, 7)}\``,
              '',
              '<details>',
              '<summary>Checkov report</summary>',
              '',
              '````text',
              report.substring(0, 30000) || 'No output.',
              '````',
              '',
              '</details>',
              '',
              '_Generated automatically by GitHub Actions._'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100
              }
            );

            const existingComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Fail if security checks failed
        if: steps.checkov.outcome == 'failure'
        run: exit 1
